[FrameGeneration]
; DynamicShaderFrameGen - FrameGen (frame interpolation) for Skyrim (works with ENB)
; ---------------------------------------------------------------------------
; v1.21 - WHAT THIS FILE IS SET UP TO TEST
;
; Two mechanisms changed, and this configuration isolates them from everything
; the previous runs already ruled out. From the 2026-09-19 logs:
;   22:54  Provider=1, 4x requested   picture completely fixed, game unplayable
;   23:22  Provider=1, NR suppressed  same freeze (so NR is not the cause)
;   23:38  Provider=0 (FSR3)          picture alive, 2x only, flicker
; => the freeze belongs to the DLSSG path, not to frame generation as such.
;
; What was actually wrong in the 22:54 run, read off its own log:
;   [MFG] blocked=571 unblocked=1        the v0.63 menu guard engaged on 571 of
;                                        572 frames, so SetDLSSGOptions and
;                                        EvaluateDLSSG were never called
;   DLSSG presented per real frame = 1   no interpolation was happening at all
;   [XRAY] MENU EDGE open=1 serial=2     and the only menu open at serial 2 was
;                                        the FADER MENU (the MENU PROBE printed
;                                        IsMenuOpen(is)=false/false/false)
; The 4x request was not being rejected by the runtime - it was never being made.
; MenuGuardFader=1 below is what stops the fader from doing that in the world.
;
; The second mechanism is the D3D11 -> D3D12 interop fence that v0.75 withdrew
; (InteropFenceWait below). dlssg 4x presented while the image did not change, and
; the D3D12 queue reads swapChainBufferWrapped, which the engine writes through
; D3D11, with nothing ordering the two. That is a stale-colour-buffer mechanism.
;
; THIS RUN, in one line: DLSSG + 4x + NR out of the way + both mechanisms on.
; ---------------------------------------------------------------------------
; Requires NVIDIA RTX 20 series+ GPU with DLSS 3 capable drivers.
; Enable=1 turns frame generation on; 0 off.
Enable=1

; Force enable even when display refresh <120Hz (frame gen is best at 120Hz+).
; On low refresh screens artifacts/tearing are possible; use with care.
ForceEnable=1

; Force borderless fullscreen (v0.26): frame generation REQUIRES a windowed
; swapchain - exclusive fullscreen disables it. When on, the game window is
; forced to borderless + maximized to the monitor (looks identical to
; fullscreen) so FG always activates regardless of in-game display settings.
ForceBorderless=1

; FrameGen (frame interpolation) provider:
; 0 = FSR3 tech - universal, works on ALL GPUs (NVIDIA & AMD) - default, most stable
; 1 = DLSSG (NVIDIA only) - multi-frame generation. The Streamline runtime
;     reports numFramesToGenerateMax=1 on Ada (RTX 40) and older, so on a 40
;     series card 3x/4x only works with an external MFG kernel unlocker
;     installed - see MFGMaxFramesOverride below. Changing this needs a game
;     restart (the swapchain path is rebuilt).
; NOTE (v0.52): changing Provider in the in-game menu has NO effect on the session you
; are in - the swapchain path is chosen once, at swapchain creation. The menu writes the
; new value here immediately and logs it, so the next launch applies it. The log line
; "FPS probe: ... cfgProvider=" shows what the running session uses; if it differs from
; Provider= above, the game needs a restart (the GUI also shows PENDING RESTART).
; ---------------------------------------------------------------------------
; 2026-09-21 15:45 -- BACK TO DLSS-G, NOW THAT PRESENT NO LONGER SERIALISES.
; The Sep 11 build reached 56.12 base at 2K because its end-of-frame wait sat on
; the D3D11 queue and returned at once; this build polled that same fence on the
; CPU until v1.44 added FenceWaitBusy. With the wait fixed this build measures
; 51.9 base / 19.3 ms at the same 2K output, same 2x FSR3 chain, nothing else
; changed (MFG_MASTER_NOTES 84.7/84.8).
; That matters here because the 2026-09-19 22:54 run -- "Provider=1, 4x
; requested - picture completely fixed, game unplayable" -- was measured on the
; serialised build. FSR3 only ever asks for 2x, so it was the one chain whose
; per-frame cost stayed invisible while the CPU was blocked in Present().
; FSR3 CANNOT DO 4x: its multiplier is hard-coded to 2x in DX12SwapChain.cpp, and
; DLSSG-Transfusion.json only hooks slDLSSGSetOptions, so the multiplier 4 in
; that json is dead weight while Provider=0. DLSS-G is the only route to 4x.
; ---------------------------------------------------------------------------
Provider=1

; Frame interpolation on/off inside the D3D12 pipeline:
; 1 = interpolate (fps doubles, default); 0 = no interpolation.
FrameGeneration=1

; NOTE (v0.52): EnableUpscale and PresetDLSS are still PARSED but NOT WIRED to anything
; - DLSS upscaling was removed in v0.48 (upscaling now happens in Main_PostProcessing),
; so editing them changes nothing. The live render-scale control is RenderResolutionScale
; (or QualityMode, when RenderResolutionScale=0).
EnableUpscale=1

; v0.24: FPS overlay (top-right bold white). 1=on 0=off. Toggle in-game via GUI menu (Home key).
FpsOverlay=1

; DLSS quality mode (upscaling mode):
; 0=DLAA (native res, best quality, heaviest) 1=Quality (recommended)
; 2=Balanced 3=Performance 4=UltraPerformance
QualityMode=1

; Render resolution scale (v0.41): engine renders at output x this ratio, DLSS
; upscales back to output. 0 = Auto (follow Quality Mode table above);
; 0.30-1.00 = custom ratio (0.70 recommended: big FPS gain, true upscaling).
; In-game: hold Home -> menu slider (live adjust, Save to INI).
RenderResolutionScale=1.00

; DLSS model preset (depends on driver and DLSS version):
; 0=Auto (recommended) 1=J 2=K 3=L 4=M
PresetDLSS=0
Sharpness=0.5

; DLSS-G multi-frame generation (v0.31/v0.50): interpolated frames per real frame.
; 1=2x, 2=3x, 3=4x, 4=5x, 5=6x - clamped to GPU/driver support.
; RTX 50 (Blackwell): native up to 5 (6x). RTX 40 (Ada): driver reports max 1 (2x).
; RTX 30/20: no native frame generation at all.
DLSSGFramesToGenerate=3

; MFG max-frames override (v0.50) - multi-frame generation on RTX 40/30/20.
; The Streamline runtime reports numFramesToGenerateMax=1 on Ada and older, which
; clamps every request down to 2x. This override raises the reported ceiling so
; higher multipliers are actually submitted.
;   0 = off, follow the hardware report exactly (default, always safe)
;   1 = 2x   2 = 3x   3 = 4x   4 = 5x   5 = 6x
; IMPORTANT: raising the ceiling only changes what is REQUESTED. The frame
; generation kernels for Ada/Ampere/Turing are not in nvngx_dlssg.dll, so you also
; need an external kernel unlocker that supplies them, for example:
;   - DLSSG-Transfusion      (RTX 40, native DLSS-G path, 2x-6x)
;   - dlssg_for_sm86         (RTX 30, embeds DLSSG 310.1 runtime)
;   - dlssg_for_sm75         (RTX 20, experimental)
;   - NVIDIA MFG Bridge      (RTX 20/30, nvngx.dll proxy)
; Without such an unlocker a high multiplier has no kernel to run and the result
; is a black screen or a hang. Enable an unlocker first, then raise this value.
MFGMaxFramesOverride=3
; ---------------------------------------------------------------------------
; WriteTransfusionConfig  (v1.46, default 0)
;
;    0 = this plugin only ever writes its own INI. The MFG Multiplier box in the
;        menu changes what THIS plugin requests, but on this machine the actual
;        on-screen multiplier is set by DLSSG-Transfusion, which reads its own
;        DLSSG-Transfusion.json (in the game root) once at launch and then
;        re-applies that value on the render thread every frame. With 0 the
;        json keeps winning and a menu change only takes effect once you edit
;        the json yourself.
;
;    1 = the menu is also allowed to write that json. When you change MFG
;        Multiplier (or tick the box in the menu), the new value is written
;        into <game dir>\DLSSG-Transfusion.json so it applies on the NEXT
;        launch. The file is backed up first as
;        DLSSG-Transfusion.json.bak-mult<N>-<timestamp>.
;
; That json belongs to a third-party mod, so this is opt-in and never happens
; unless you set it. For an immediate change without restarting, use
; Transfusion's own hotkeys: Ctrl+Alt+2..6 (fixed multiplier), PageUp/PageDown
; (step), Ctrl+Alt+D (fixed <-> dynamic), Ctrl+Alt+O (overlay on/off).
WriteTransfusionConfig=0
; ---------------------------------------------------------------------------
; v1.05 - WHAT CHANGED ABOUT THESE TWO VALUES
;
; They are the value the plugin actually SUBMITS. There is exactly one writer
; of numFramesToGenerate in this process, and it is this plugin.
;
; v1.03 tried to hand the multiplier over to an external unlocker whenever one
; was detected (dinput8.dll = DLSSG-Transfusion, dlssg_for_sm86/sm89, MFG
; Bridge). That was wrong twice over, and the second mistake is what froze the
; 2026-09-18 19:16 session:/r/n;
;   (a) it also clamped THIS plugin's request ceiling down to the stock runtime
;       report (numFramesToGenerateMax), so the ladder that exists to find the
;       highest accepted multiplier could never even attempt the value you asked
;       for. MFGMaxFramesOverride=3 could not reach 4x by construction.
;
;   (b) the "keep whatever the unlocker wrote" fallback read a ZERO-INITIALISED
;       local struct:/r/n;           opts.numFramesToGenerate = std::max<std::uint32_t>(1, opts.numFramesToGenerate);
;       opts is built fresh on every call, so that expression is always
;       std::max(1, 0) == 1 == 2x. It does not preserve the unlocker's value, it
;       OVERWRITES it with 2x on every single frame. Transfusion set 4x, this
;       plugin set 2x, the pacer never converged, and the frame ended inside
;       Present(). The 19:16 log shows the result: one presented frame, a
;       19480.5 ms frame, and the watchdog attributing the whole stall to
;       Present() with presentAge=19400ms.
;
; The contract is now:/r/n;   unlocker PRESENT -> the request ceiling is max(runtime report, this INI
;                      override), so a real 4x is attemptable; this plugin still
;                      writes numFramesToGenerate every frame, and the unlocker
;                      does its own work on top.
;   unlocker ABSENT  -> the request stays at the runtime report. Asking higher
;                      with no kernel behind it buys one rejected frame per rung:/r/n;                      the 18:23 run spent a rejected 4x and a rejected 3x,
;                      19945.3 ms in a single frame.
;
; The ladder still steps up only on an observed acceptance, so a failed attempt
; costs one rung rather than the session.
;
; Evidence that 4x really works with an unlocker (DLSSG-Transfusion.log,
; 2026-09-18 07:29, Ada / RTX 40):
;     Applied fixed multiplier: 4x, result=0 (eOk)
;     DLSS-G actual presentation count: 4x (maximum generated frames=5)
;     [PERF] 4x | Kernel: Ada | FPS: 39.6 (25.28ms)
;
; The heartbeat carries mfg(hwMax/reqMax/rungsSkipped)=a/b/c so the log itself
; says whether the ladder was capped, and the watchdog names
; "d3d11 SetDLSSGOptions" instead of "d3d11 Wait" if that call ever parks.
; ---------------------------------------------------------------------------

; ---------------------------------------------------------------------------
; v0.63 - Frame limiter value handed to Reflex (0 = auto). Unit: fps.
;
; NAME CHANGED ON PURPOSE (v0.54 -> v0.63): this value limits the rate at which
; frames are PRESENTED to the panel (flips), not the rate the engine renders at.
; v0.54 divided the refresh rate by the multiplier ("39 fps render => 156
; presented") on the assumption that the limiter sits on the render side. It does
; not, so the division landed twice and the render side collapsed.
;
;   measured 2026-09-17 21:54 run, 3840x2160, multiplier 4:
;     heartbeat capUs = 25641 for every sample        (25.641 ms = 39.0 fps)
;     real frame interval = 102.56 ms                 (4.0000 x 25641 us)
;     65 consecutive perf.csv frames: 102.55/102.56/102.57  (spread 0.02 ms)
;     DLSSG: "presented per real frame = 4"
;   => 4 flips per real frame at a 25.641 ms flip budget = 102.56 ms per real
;      frame = 9.75 real fps. Standing in a menu that is a mild shimmer; the
;      3 fabricated frames of every 4 have to reproject across up to 102 ms of
;      motion, so it falls apart as soon as the camera moves.
;
; Auto (0) = refresh rate - 1 fps, i.e. the flip schedule sits just under the
; panel. On a 160Hz panel that is 159 fps => 159/4 = ~39.75 real fps.
; Because the cap is below the refresh rate, over-submission (the thing v0.54 was
; trying to fix) still cannot happen.
; Logged whenever it changes:
;   [Streamline] Reflex FLIP cap = 159 fps (6289us) - panel 160Hz, 4 flips per
;   real frame => ~159 presented fps (real = cap/flips)
;
; Set an explicit fps here to override the automatic value. 0 = auto.
; ---------------------------------------------------------------------------
ReflexFpsLimit=0

; v0.63 - Do not submit frames to DLSS-G while a game menu is open.
; 1 = menus are not interpolated (default; a menu is 2D UI and interpolating it
;     shows up as a continuously flickering menu screen).
; 0 = old behaviour (menus are interpolated too).
; This is the plugin-side replacement for DLSSGFlags::eEnableFullScreenMenuDetection:
; the shim strips that flag from the DLSS-G options before the runtime sees it
; (log line "Option C active: stripped eEnableFullscreenMenuDetection from
; DLSS-G options (game flags=0x00000010 -> 0x00000010)" - identical before and
; after), so the flag can never take effect and the plugin does it itself.
; The Home/toggle key is unaffected.
MenuDisableFrameGen=1

; ---------------------------------------------------------------------------
; v1.52 - COEXISTENCE SWITCHES. Unit: boolean. Default 1 on both.
;
; Why these keys exist. CommunityShaders and this plugin both write a jump over
; the same two engine function heads:
;
;     BSInputDeviceManager::PollInputDevices      REL 67315 / 68617
;     MenuManager::DrawInterfaceStart             REL 79947 / 82084
;
; Each side believes it is the head of the chain. CS installs at 12:04:44; this
; plugin installs 50 s later at 12:05:34 and writes its own jump over the same
; prologue bytes, landing on a jump target CS already owns. The process takes an
; EXCEPTION_BREAKPOINT before the main menu finishes drawing
; (crash-2026-09-22-12-05-34.log, faulting address outside every loaded module).
;
; Set BOTH to 0 in any modpack that ships CommunityShaders.
;
;     MenuDrawHook
;       1 = detour MenuManager::DrawInterfaceStart (default).
;       0 = do not detour it. Costs nothing functional: the landing site is
;           OnMenuDrawStart(), which has been an empty function since v0.50
;           (the DLSS upscaler it fed was removed; its kFRAMEBUFFER path is
;           unreachable dead code). Only the "just before UI draw" timing point
;           is lost.
;
;     PollInputHook
;       1 = thunk BSInputDeviceManager::PollInputDevices (default).
;       0 = do not thunk it. The menu still opens and still takes input: ImGui
;           reads the mouse with GetCursorPos + GetAsyncKeyState, and the toggle
;           key arrives through ToggleInputHandler's AddEventSink, which is
;           registered before the detour is written. The only loss is that the
;           mouse turns the camera while the menu is open.
;
; Both values are logged at INI load, and a LEGACY-HOOK SUPPRESSION ACTIVE
; warning is printed at kDataLoaded when either is 0, so "was it even read" can
; never be confused with "it was read and did nothing".
; ---------------------------------------------------------------------------
MenuDrawHook=1
PollInputHook=1

; ---------------------------------------------------------------------------
; v1.21 - which menus count as menus. Unit: boolean.
;
; 1 = the Fader Menu counts as a menu only while we cannot yet be in the world
;     (the Loading Menu is open, or we are in the first 90 s of the session).
;     This is the default and it is what the two runs above call for.
; 0 = the Fader Menu never counts.
;
; Why this key exists at all. GameMenuOpenNow() counted IsMenuOpen("Fader Menu")
; as "a menu is up", and the 23:38 log shows the fader is up for the ENTIRE time
; the player is in the world: fade=1 for 40+ consecutive seconds while paused=0,
; ld=0, and Calendar advanced 0.0057 game-hours per real second (timescale 20,
; i.e. the game was simulating normally). With MenuDisableFrameGen=1 that made
; the menu guard permanent, and the 22:54 run's own counter says so:
; blocked=571 unblocked=1.
;
; It still has to hold during start-up. v0.96 removed the fader term outright and
; the game could not be entered, and the 22:54 MENU PROBE explains why: at serial
; 2 every real menu was closed, so the fader was the only thing holding the guard
; during the frames where the swapchain and the pacer are still coming up.
; ---------------------------------------------------------------------------
MenuGuardFader=1
; v1.22 PIXEL PROBE. 1 = sample a 64x64 block from the centre of the frame the
; plugin hands to the swap chain, once per second, and log whether it changed
; (grep the log for [PIXEL]). 0 = off.
;
; Why: up to v1.21 every witness the plugin owns (Present's return, presentAge,
; dsync, the presented-per-real-frame ratio) reports that a flip HAPPENED, and
; none of them can see that the same buffer was flipped again. The 00:30 run
; measured ratio = 4.00, dsync = 0 and presentAge 5-8 ms while the player
; reported a frozen screen. Reading pixels is the only thing that separates
; "the world is running" from "the screen is stale".
;
; Cost: one small copy plus one Map per second. The Map uses DO_NOT_WAIT, so a
; sample that is not ready is dropped rather than stalling the render thread,
; and any failure disables the probe permanently with a single log line.
PixelProbe=1
;
; v1.34 (T2) -- FORCE THE BACK BUFFER COPY (diagnostic).
; Normally the passthrough CopyResource below runs only when dlssgOk is false,
; i.e. only when DLSS-G itself failed. The 21:26 run showed the freeze surviving
; with the SECOND DLSS-G writer (DLSSG-Transfusion, loaded as dinput8.dll) renamed
; away, and it showed two independent channels agreeing: the colour buffer [PIXEL]
; changes on every sample, while the back buffer [BACKBUF] we hand to DXGI does not.
; So the break sits on our side of the flip, between colorOut and the back buffer.
; With ForceBackBufferCopy=1, colorOut is copied over the back buffer even when
; DLSS-G reports success: picture comes back -> DLSS-G never filled it; still
; frozen -> the back buffer does hold new content and the break is downstream, in
; the flip itself. 0 = the old behaviour. Set back to 0 for normal play.
ForceBackBufferCopy=1
; DLSSG-Transfusion (RTX 40) drives the multiplier with ITS OWN hotkeys, live and
; without a game restart: Ctrl+Alt+2 / Ctrl+Alt+3 / Ctrl+Alt+4 = 2x / 3x / 4x,
; Page Up / Page Down steps the multiplier, Ctrl+Alt+D toggles fixed/dynamic mode.
; Its overlay is switched on by "showOverlay" in DLSSG-Transfusion.json. Do not try
; to drive it from the game's video menu. If Transfusion is active, the value above
; is only the plugin's request; the log line
;   "DLSSG presented per real frame = N"
; is the runtime's own measurement and the only reliable proof of what is actually
; being generated (1 = no interpolation, 4 = 4x).

; ---------------------------------------------------------------------------
; v0.57 - mvecScale override: the motion-vector scale handed to DLSS-G every frame.
;
; sl::Constants::mvecScale tells DLSS-G how to normalise the motion vectors so the
; values land in [-1,1]. NVIDIA's guide: "values in {-1,1} range -> scale factor
; should be {1,1}". The standard full-frame path should therefore be identity;
; open-shaders agrees ("must keep mvecScale at identity or DLSS massively
; over-estimates motion").
;
; This engine's motion vectors are reported as displacement / screen width, which
; already reaches 1.0 for a full-screen pan, i.e. already inside [-1,1]. The legacy
; value used below is 1/renderScale (= 1.5 at QualityMode=1, a 50% motion
; over-estimate), tuned in-game at v0.49k against a different defect.
;
;   0.00 = legacy 1/renderScale (default, behaviour unchanged)
;   1.00 = identity, the reference-implementation value
;
; The effective value is logged once per run:
;   [Streamline] mvecScale = { 1.5000, 1.5000 } (renderScale=0.6667 override=0.00)
;
; NOTE: the build's POST_BUILD step copies THIS file over the one in the mod folder
; (copy_if_different). Set the value here if it must survive a rebuild; edit the
; deployed copy only for a one-off A/B, and do not rebuild in between.
; ---------------------------------------------------------------------------
MvecScaleOverride=1.00

; ===== DLSS 5 Neural Rendering (NGX Feature 18, built in since v0.48) =====
; Neural re-lighting / detail synthesis applied to the upscaled frame, before
; UI composition. Runs in series with frame generation. Requires RTX 20+ and
; nvngx_dlssnr.dll 310.8.x under Shaders/Upscaling/Streamline/.
NeuralRenderingEnabled=1

; v1.01 - run DLSS5 Neural Rendering IN SERIES with frame generation.
; 0 = mutually exclusive (default; v0.69 behaviour: NR is suppressed while
;     frame generation is active).
; 1 = NR runs first on the real frame and DLSS-G then interpolates the
;     neural-rendered result. The order is already correct in Present()
;     (NR writes swapChainBufferWrapped, which is what EvaluateDLSSG reads,
;     with the D3D11->D3D12 fence between them).
; Start at 0 if the picture flickers; raise NRRenderScale cost awareness
; first - full-resolution NR on every frame is the expensive part.
; v1.21: set to 0 for the 4x run. NR is not what froze the picture (23:22 ran
; with NR suppressed and froze anyway) but it costs about half the render rate
; (v0.69: 53 -> 27 fps with full-resolution NR live) and two temporal processors
; writing history for the same frame is a documented flicker source. Once 4x is
; stable, set this back to 1 to get DLSS5 and multi-frame generation together.
; 2026-09-20 22:0x -- 4x IS NOW STABLE and this is the switch the v1.21 note above
; asked for. Evidence that 4x works (21:51 run): "MFG override 3 <= hardware max 5",
; "runtime ACCEPTED 4x (3 interpolated frames)", "FLIPS per real frame = 4.00"
; (10 samples, DXGI's own count), presented bucket 4 = 1314, watchdog verdicts 0,
; and Transfusion's own line "DLSS-G actual presentation count: 4x". With NR at 0
; the log said "DLSSNR suppressed: frame generation is active" - i.e. DLSS5 was
; switched off BY US, on purpose, to get 4x. Now the two should chain:
; NR runs first on the real frame, DLSS-G interpolates the neural-rendered result.
; Revert to 0 if the picture flickers (two temporal processors writing history for
; the same frame is the documented flicker source). If NR costs too much frame rate,
; lower NRRenderScale before giving up (1.00 -> 0.75 is the documented sweet spot).
; 2026-09-20 23:47 -- first tried 0 (mutual exclusion) as a single-variable
; experiment for the reported ghosting with 4x. It did remove the ghosting, but it
; also removed DLSS5 entirely (log: "DLSSNR suppressed", frames=0), so that was not
; the answer either.
; 2026-09-21 00:00 -- back to 1. DX12SwapChain.cpp:1725-1729 records the author
; retracting the original "stacking flickers" verdict: that run ALSO had
; full-resolution NR plus "D3D12 command contexts saturated", so the evidence was
; confounded and does not prove the pair is impossible. Keep chaining and remove the
; saturation instead -- see NRRenderScale below (now 0.50, wired in v1.38/v1.39).
NRAllowWithFrameGen=1

; Tuning (also available as in-game sliders: hold Home -> DLSS5 Neural Rendering)
; Intensity of the neural render pass (0.0-2.0, 1.0 = neutral).
NRIntensity=0.80
; Local contrast / tone shaping strength (0.0-2.0).
NRLocalTone=0.75
; Local structure synthesis strength - surface detail (0.0-2.0).
NRLocalStructure=0.90
; Skin structure synthesis strength (0.0-2.0).
NRSkinStructure=0.90
; Style preset 0-3 (3 = default).
NRStyle=3
; Automatic masking - keeps flat / uniform areas untouched (recommended).
NRAutoMask=1
; UI correction - compensate for neural pass applied over UI (usually 0).
NRUICorrection=0
; DLSSNR input resolution scale (0.25-1.00). 1.0 = full-resolution analysis
; (best detail); lower = faster (fewer FP8 ops) but less detail. 0.75 rec.
NRRenderScale=0.50

; v1.45 - DLSS5 neural rendering LAYERS (1..kMaxNRLayers=8). 1 = off => v1.44 behaviour.
; Each layer runs the neural renderer again on the PREVIOUS layer's output, reusing the
; same depth/mvec guides, inside the same D3D12 command list (no extra copies, no extra
; D3D11<->D3D12 handoffs). Every layer is a separate NGX Feature 18 instance with its own
; temporal history, so BOTH frame cost and VRAM scale with this number - it is not free.
; Not quality-verified: stacking a temporal processor on its own output can amplify
; trailing/ghosting (same family as NR+DLSS-G chaining, which the author documents as
; "two temporal processors writing history for the same frame"). Raise it one step at a
; time and watch the FPS probe, not the overlay.
; In-game slider: hold Home -> DLSS5 Neural Rendering -> "DLSS5 Layers".
NRLayers=1

; ---------------------------------------------------------------------------
; v1.21 - the D3D11 -> D3D12 interop fence. Unit: boolean.
;
; 1 = the render thread signals the shared fence on the D3D11 side and the D3D12
;     queue waits on it before this frame's D3D12 work (default).
; 0 = the v0.75 behaviour: that wait is withdrawn.
;
; v0.75 withdrew it on the argument that the fence had "held its initial value 1
; for 50 s". A fence nobody signals looks exactly like that. What the withdrawal
; costs: the D3D12 queue reads swapChainBufferWrapped / colorOutWrapped - both
; written by the engine and by DLSS5 NR through D3D11 - with no ordering at all,
; while the comment at the "fence before" site still says the design relies on
; that ordering. The reference implementation this project ports from
; (doodlum/ENBFrameGeneration) keeps the two-way wait, and the v0.75 note itself
; says the change was "a hypothesis to be refuted, not a port from a working
; reference".
;
; The symptom that put it back on the table: the 22:54 watchdog shows the DXGI
; present counter running away from the real-frame counter (frames=643
; lastPr=832 - 4x really was being presented) while the image did not change.
;
; It is a key rather than a constant so that both behaviours can be compared
; without a rebuild, and so that a run which wedges on the wait is reverted by
; editing this one line. If the picture freezes again, set this to 0 first: that
; tells us the withdrawal was load-bearing, which is itself a result.
; ---------------------------------------------------------------------------
InteropFenceWait=1
;
; v1.44 -- WHERE THE END-OF-FRAME FENCE WAIT SITS. This is the one line that
; separates this build from the Sep 11 build at the end of Present(), and it is
; worth a setting because the two behaviours differ by a whole frame of CPU/GPU
; overlap. Every frame signals the shared fence on the D3D12 queue and then has to
; wait for it; d3d11Fence and d3d12Fence wrap the SAME fence object, so the wait
; can be placed on either timeline.
;   1 = the CPU polls d3d12Fence->GetCompletedValue() until it passes
;       (v1.03b..v1.43). The poll runs on the render thread: the CPU submits a
;       frame and then blocks until the GPU has finished it, so no frame is ever
;       prepared while the previous one is still executing.
;   0 = d3d11Context->Wait(d3d11Fence, v): the wait is queued on the D3D11
;       timeline and the CPU returns immediately - what the Sep 11 build did, and
;       why it reached 56.12 base at 2K where this build reached 36.08.
;
; 2026-09-21, same box, same 2K output, same FSR3 2x chain: Sep 11 build (0)
; 56.12 base / 17.8 ms; this build (1) 36.08 base / 27.7 ms with the watchdog
; reporting 92-98% of samples in "stage=d3d11 Wait". The watchdog number alone is
; not proof - it is exactly where the code was told to block - which is why this
; is a switch and not a conclusion. Also live in the in-game menu (Home):
; "Busy-wait fence in Present", no restart needed.
;
; If the game freezes on 0, set this back to 1: mode 1 keeps the v1.03b guard and
; can only drop a frame, while mode 0 can stall the D3D11 QUEUE if the fence is
; never signalled (the 2026-09-18 18:23 failure).
FenceWaitBusy=0

; Streamline log level: 0=Off 1=Default 2=Verbose (troubleshooting; keep 0 normally)
StreamlineLogLevel=0

; In-game toggle key (virtual key code, hex):
; 0x24 = Home (default); press once to enable, again to disable. Immediate effect, no restart needed.
ToggleKey=0xC7
